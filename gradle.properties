# JVM 参数
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 使用 AndroidX（必填，依赖了 androidx / miuix）
android.useAndroidX=true
android.nonTransitiveRClass=true

# 用 JDK 26 运行 Gradle（compileOptions 目标是 Java 24，需要 ≥24 的 JDK 编译）
org.gradle.java.home=C:/Program Files/Zulu/zulu-26

# ── AGP 9 兼容开关 ──────────────────────────────────────────
# AGP 9 默认启用 built-in Kotlin（要求移除 KGP）。
# 本项目仍使用 org.jetbrains.kotlin.android 插件，这里退回经典行为。
# 注意：AGP 10 将移除这两个开关。
android.builtInKotlin=false
android.newDsl=false